[project]
name = "heatpro"
version = "0.1.6"
description = "Generate heat demand load profile for distict heating"
authors = [
    { name = "Robinson Beaucour", email = "robinson.beaucour@cea.fr" },
    { name = "Nicolas Lamaison", email = "nicolas.lamaison@cea.fr" },
    { name = "Thibaut Wissocq", email = "thibaut.wissocq@cea.fr" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "CECILL-B"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
doc = [
    "recommonmark>=0.7.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]
notebook = [
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "plotly>=6.5.2",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true
